<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-labelledby="title desc"><title id="title">The circumcenter and orthocenter in an acute triangle</title><desc id="desc">In Problem 3, ABC is acute. The circumcircle has center O, and the altitude AD passes through the orthocenter H. Gold AO and teal AH are the rays to be compared. The dashed radii OB and OC form the two isosceles radius triangles used in the proof. The right-angle marker shows AD perpendicular to BC; O and H both lie strictly inside the triangle.</desc><rect width="560" height="480" fill="#fdfcf9"/><g stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
