<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" role="img" aria-labelledby="title desc"><title id="title">The two pairs of similar right triangles in Heron’s proof</title><desc id="desc">Problems 7–8 use Venema’s Figure 4.4 notation. The incircle has center I and contacts X on BC, Y on CA, Z on AB. The A-excircle has center E and contacts T strictly inside BC, U beyond C on AC, V beyond B on AB. The shaded right triangles are AZI and AVE, and ZBI and VEB. The contact radii IZ and EV meet AB at right angles. Segment AE follows the internal bisector at A, and BI and BE are perpendicular internal and exterior bisectors at B. X is labeled above BC and T below it. Both circles and all contacts are constructed from the triangle.</desc><rect width="560" height="760" fill="#fdfcf9"/><g stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
