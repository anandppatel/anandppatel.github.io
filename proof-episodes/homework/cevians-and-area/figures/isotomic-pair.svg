<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" width="560" height="430" role="img" aria-labelledby="title desc"><title id="title">Side reflections exchange the Gergonne and Nagel contacts</title><desc id="desc">In Problem 1, the blue cevians through the incircle contacts D, E, F concur at G_e. Their teal partners through D′, E′, F′ concur at N_a. Each primed contact is the reflection of the unprimed contact in its side midpoint, and is the contact of the opposite excircle: D′=T_A, E′=T_B, F′=T_C. The pair AD, AD′ is emphasized. The dashed short line is the perpendicular bisector of BC; the excircles themselves are omitted.</desc><rect width="560" height="430" fill="#fdfcf9"/><g stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
