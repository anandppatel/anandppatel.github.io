<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="title desc"><title id="title">The symmedian point in a right triangle</title><desc id="desc">Triangle ABC is right angled at A. AD is the altitude to the hypotenuse BC. L is the midpoint of AD. The problem asks students to prove that L is the symmedian point; the other two symmedians are drawn faintly.</desc><rect width="560" height="400" fill="#fdfcf9"/><g stroke-linecap="round" stroke-linejoin="round" font-family="Georgia, 'Times New Roman', serif">
