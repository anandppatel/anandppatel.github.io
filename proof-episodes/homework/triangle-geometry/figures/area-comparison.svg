<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Comparing areas from an interior point</title>
  <desc id="desc">A noncollinear triangle ABC contains a strictly interior point P. The ray from A through P meets side BC at X, with A, P, X in that order. The four smaller triangles PAB, PCA, PXB, and PXC are labeled. No equality of areas is assumed.</desc>
  <defs><marker id="ray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8795"/></marker></defs>
  <rect width="560" height="380" fill="#fdfcf9"/>
  <g font-family="Georgia, 'Times New Roman', serif" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="304.7,203.1 190,45 60,300" fill="#315dcc" fill-opacity="0.09"/>
    <polygon points="304.7,203.1 510,300 190,45" fill="#087c70" fill-opacity="0.09"/>
    <polygon points="304.7,203.1 375,300 60,300" fill="#a66b15" fill-opacity="0.09"/>
    <polygon points="304.7,203.1 375,300 510,300" fill="#ad4159" fill-opacity="0.09"/>
    <line x1="190" y1="45" x2="60" y2="300" stroke="#26364b" stroke-width="2.2" />
    <line x1="60" y1="300" x2="510" y2="300" stroke="#26364b" stroke-width="2.2" />
    <line x1="510" y1="300" x2="190" y2="45" stroke="#26364b" stroke-width="2.2" />
    <line x1="304.7" y1="203.1" x2="60" y2="300" stroke="#315dcc" stroke-width="1.8" />
    <line x1="304.7" y1="203.1" x2="510" y2="300" stroke="#087c70" stroke-width="1.8" />
    <line x1="190" y1="45" x2="400.9" y2="335.7" stroke="#7b8795" stroke-width="1.8" marker-end="url(#ray-arrow)"/>
    <circle cx="190" cy="45" r="3.4" fill="#26364b"/>
    <text x="190" y="27" font-size="23" fill="#26364b" text-anchor="middle">A</text>
    <circle cx="60" cy="300" r="3.4" fill="#26364b"/>
    <text x="44" y="323" font-size="23" fill="#26364b" text-anchor="middle">B</text>
    <circle cx="510" cy="300" r="3.4" fill="#26364b"/>
    <text x="525" y="323" font-size="23" fill="#26364b" text-anchor="middle">C</text>
    <circle cx="304.7" cy="203.1" r="3.4" fill="#26364b"/>
    <text x="298" y="229" font-size="23" fill="#26364b" text-anchor="middle">P</text>
    <circle cx="375" cy="300" r="3.4" fill="#26364b"/>
    <text x="364" y="326" font-size="23" fill="#26364b" text-anchor="middle">X</text>
    <text x="179" y="188" font-size="20" fill="#315dcc" text-anchor="middle">[PAB]</text>
    <text x="336" y="199" font-size="18" fill="#087c70" text-anchor="middle">[PCA]</text>
    <text x="244" y="279" font-size="19" fill="#a66b15" text-anchor="middle">[PXB]</text>
    <text x="400" y="279" font-size="19" fill="#ad4159" text-anchor="middle">[PXC]</text>
  </g>
</svg>
