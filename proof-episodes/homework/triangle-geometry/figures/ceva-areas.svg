<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Three concurrent cevians and their surrounding areas</title>
  <desc id="desc">In triangle ABC, D lies inside BC with BD/DC equal to 2, and E lies inside CA with CE/EA equal to 3. The interior point F on AB is positioned so that AD, BE, and CF meet at P. The three main regions are labeled x for the area of PAB, y for the area of PBC, and z for the area of PCA. No unknown length or area ratios are labeled.</desc>
  <rect width="560" height="380" fill="#fdfcf9"/>
  <g font-family="Georgia, 'Times New Roman', serif" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="211.66667,126.66667 140,35 55,310" fill="#315dcc" fill-opacity="0.09"/>
    <polygon points="211.66667,126.66667 55,310 505,310" fill="#087c70" fill-opacity="0.075"/>
    <polygon points="211.66667,126.66667 505,310 140,35" fill="#ad4159" fill-opacity="0.09"/>
    <line x1="140" y1="35" x2="55" y2="310" stroke="#26364b" stroke-width="2.2"/>
    <line x1="55" y1="310" x2="505" y2="310" stroke="#26364b" stroke-width="2.2"/>
    <line x1="505" y1="310" x2="140" y2="35" stroke="#26364b" stroke-width="2.2"/>
    <line x1="140" y1="35" x2="355" y2="310" stroke="#7b8795" stroke-width="1.7"/>
    <line x1="55" y1="310" x2="231.25" y2="103.75" stroke="#7b8795" stroke-width="1.7"/>
    <line x1="505" y1="310" x2="127.85714" y2="74.28571" stroke="#7b8795" stroke-width="1.7"/>
    <circle cx="140" cy="35" r="3.4" fill="#26364b"/>
    <text x="142" y="23" font-size="23" fill="#26364b" text-anchor="middle">A</text>
    <circle cx="55" cy="310" r="3.4" fill="#26364b"/>
    <text x="38" y="334" font-size="23" fill="#26364b" text-anchor="middle">B</text>
    <circle cx="505" cy="310" r="3.4" fill="#26364b"/>
    <text x="520" y="334" font-size="23" fill="#26364b" text-anchor="middle">C</text>
    <circle cx="355" cy="310" r="3.4" fill="#26364b"/>
    <text x="355" y="338" font-size="23" fill="#26364b" text-anchor="middle">D</text>
    <circle cx="231.25" cy="103.75" r="3.4" fill="#26364b"/>
    <text x="248" y="98" font-size="23" fill="#26364b" text-anchor="middle">E</text>
    <circle cx="127.85714" cy="74.28571" r="3.4" fill="#26364b"/>
    <text x="108" y="76" font-size="23" fill="#26364b" text-anchor="middle">F</text>
    <circle cx="211.66667" cy="126.66667" r="3.4" fill="#26364b"/>
    <text x="218" y="151" font-size="23" fill="#26364b" text-anchor="middle">P</text>
    <text x="135" y="176" font-size="27" fill="#315dcc" text-anchor="middle">x</text>
    <text x="263" y="269" font-size="27" fill="#087c70" text-anchor="middle">y</text>
    <text x="267" y="155" font-size="23" fill="#ad4159" text-anchor="middle">z</text>
  </g>
</svg>
