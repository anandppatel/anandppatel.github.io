<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Two diameter circles and an exterior altitude foot</title>
  <desc id="desc">Triangle ABC has an obtuse angle at B. D is the perpendicular foot from A on the full line BC and lies outside segment BC, beyond B. The dashed circle has diameter AB; the solid circle has diameter AC. Both circles pass through A and D. A right-angle marker identifies AD as perpendicular to line BC.</desc>
  <rect width="560" height="380" fill="#fdfcf9"/>
  <g font-family="Georgia, 'Times New Roman', serif" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="287.5" cy="180" r="172.2099" fill="none" stroke="#087c70" stroke-width="2.2"/>
    <circle cx="190" cy="180" r="97.08244" fill="none" stroke="#315dcc" stroke-width="2.2" stroke-dasharray="7 5"/>
    <line x1="60" y1="260" x2="510" y2="260" stroke="#7b8795" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="135" y1="100" x2="245" y2="260" stroke="#26364b" stroke-width="2.2"/>
    <line x1="245" y1="260" x2="440" y2="260" stroke="#26364b" stroke-width="2.2"/>
    <line x1="440" y1="260" x2="135" y2="100" stroke="#26364b" stroke-width="2.2"/>
    <line x1="135" y1="100" x2="135" y2="260" stroke="#a66b15" stroke-width="2"/>
    <polyline points="145,260 145,250 135,250" fill="none" stroke="#7b8795" stroke-width="1.6"/>
    <circle cx="135" cy="100" r="3.4" fill="#26364b"/>
    <text x="119" y="89" font-size="23" fill="#26364b" text-anchor="middle">A</text>
    <circle cx="245" cy="260" r="3.4" fill="#26364b"/>
    <text x="248" y="286" font-size="23" fill="#26364b" text-anchor="middle">B</text>
    <circle cx="440" cy="260" r="3.4" fill="#26364b"/>
    <text x="450" y="286" font-size="23" fill="#26364b" text-anchor="middle">C</text>
    <circle cx="135" cy="260" r="3.4" fill="#26364b"/>
    <text x="122" y="286" font-size="23" fill="#26364b" text-anchor="middle">D</text>
  </g>
</svg>
