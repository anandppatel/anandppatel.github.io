<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">The triangle formed by the three side midpoints</title>
  <desc id="desc">In noncollinear triangle ABC, D is the midpoint of BC, E is the midpoint of CA, and F is the midpoint of AB. Matching tick marks identify the two equal halves of each side. Segments DE, EF, and FD form the midpoint triangle. No centers or altitude lines are drawn.</desc>
