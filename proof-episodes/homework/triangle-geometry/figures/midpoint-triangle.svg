    <line x1="431.16087" y1="230.78169" x2="424.92883" y2="238.60229" stroke="#26364b" stroke-width="1.7" /><line x1="435.07117" y1="233.89771" x2="428.83913" y2="241.71831" stroke="#26364b" stroke-width="1.7" />
