<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Three triangles with a common height equal to the inradius</title>
  <desc id="desc">The incenter I lies inside triangle ABC and is joined to all three vertices. Three segments from I meet the sides perpendicularly; each is labeled r, the inradius, and each has a right-angle marker. The sides BC, CA, and AB are labeled a, b, and c. These are symbolic lengths, not a scale drawing for the numerical example.</desc>
