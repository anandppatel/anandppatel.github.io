<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Reflecting the orthocenter across a sideline</title>
  <desc id="desc">A scalene acute triangle ABC has orthocenter H. Two dashed altitude lines locate H, and A₁ is the foot from A on the full line BC. The point H′ is the reflection of H across BC: H, A₁, H′ are collinear, the line is perpendicular to BC, and matching tick marks indicate HA₁ equals A₁H′. No circumcircle is drawn.</desc>
  <rect width="560" height="400" fill="#fdfcf9"/>
  <g font-family="Georgia, 'Times New Roman', serif" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 10)">
    <polygon points="215,25 95,220 445,220" fill="#315dcc" fill-opacity="0.035"/>
    <line x1="45" y1="220" x2="510" y2="220" stroke="#7b8795" stroke-width="1.5" stroke-dasharray="4 5"/>
    <line x1="215" y1="25" x2="95" y2="220" stroke="#26364b" stroke-width="2.2"/>
    <line x1="95" y1="220" x2="445" y2="220" stroke="#26364b" stroke-width="2.2"/>
    <line x1="445" y1="220" x2="215" y2="25" stroke="#26364b" stroke-width="2.2"/>
    <line x1="215" y1="25" x2="215" y2="220" stroke="#7b8795" stroke-width="1.7" stroke-dasharray="5 5"/>
    <line x1="95" y1="220" x2="241.37064" y2="47.35771" stroke="#7b8795" stroke-width="1.5" stroke-dasharray="5 5"/>
    <polyline points="247.47269,52.53119 242.29921,58.63325 236.19715,53.45977" fill="none" stroke="#7b8795" stroke-width="1.6"/>
    <line x1="215" y1="78.46154" x2="215" y2="361.53846" stroke="#087c70" stroke-width="2.3"/>
    <polyline points="225,220 225,210 215,210" fill="none" stroke="#7b8795" stroke-width="1.6"/>
    <line x1="220" y1="149.23077" x2="210" y2="149.23077" stroke="#087c70" stroke-width="1.9"/>
    <line x1="220" y1="290.76923" x2="210" y2="290.76923" stroke="#087c70" stroke-width="1.9"/>
    <circle cx="215" cy="25" r="3.4" fill="#26364b"/>
    <text x="215" y="18" font-size="23" fill="#26364b" text-anchor="middle">A</text>
    <circle cx="95" cy="220" r="3.4" fill="#26364b"/>
    <text x="78" y="244" font-size="23" fill="#26364b" text-anchor="middle">B</text>
    <circle cx="445" cy="220" r="3.4" fill="#26364b"/>
    <text x="461" y="244" font-size="23" fill="#26364b" text-anchor="middle">C</text>
    <circle cx="215" cy="78.46154" r="3.4" fill="#26364b"/>
    <text x="236" y="90" font-size="23" fill="#26364b" text-anchor="middle">H</text>
    <circle cx="215" cy="361.53846" r="3.4" fill="#26364b"/>
    <text x="237" y="371" font-size="23" fill="#26364b" text-anchor="middle">H′</text>
    <circle cx="215" cy="220" r="3.4" fill="#26364b"/>
    <text x="235" y="246" font-size="23" fill="#26364b" text-anchor="middle">A₁</text>
  </g>
</svg>
