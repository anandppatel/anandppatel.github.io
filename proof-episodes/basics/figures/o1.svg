<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">A radius perpendicular to a tangent</title>
<desc id="desc">A circle with center O meets a vertical tangent line at T. The radius OT and the tangent form a marked right angle.</desc>
<rect width="480" height="300" fill="white"/>
<g fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic">
<circle cx="195" cy="150" r="94"/><line x1="289.000" y1="25.000" x2="289.000" y2="275.000" stroke="#20324A"/><line x1="195.000" y1="150.000" x2="289.000" y2="150.000" stroke="#087F8C"/><polyline points="275.000,150.000 275.000,136.000 289.000,136.000" stroke="#087F8C"/><circle cx="195.000" cy="150.000" r="3.5" fill="#20324A" stroke="none"/><circle cx="289.000" cy="150.000" r="3.5" fill="#20324A" stroke="none"/><text x="178.000" y="157.000" fill="#20324A" stroke="none" text-anchor="middle">O</text><text x="311.000" y="157.000" fill="#20324A" stroke="none" text-anchor="middle">T</text><text x="310.000" y="40.000" fill="#20324A" stroke="none" text-anchor="middle">ℓ</text><text x="242.000" y="175.000" fill="#087F8C" stroke="none" text-anchor="middle">r</text>
</g></svg>