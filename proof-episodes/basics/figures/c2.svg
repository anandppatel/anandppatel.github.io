<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="c2-title c2-desc"><title id="c2-title">Translation of a triangle</title><desc id="c2-desc">The same horizontal translation takes A, B and C to A prime, B prime and C prime. The two triangles have equal corresponding lengths and angles.</desc><defs><marker id="c2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polygon points="50.00,205.00 175.00,205.00 95.00,70.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="280.00,205.00 405.00,205.00 325.00,70.00" fill="none" fill-opacity="1" stroke="#087F8C" stroke-width="3" stroke-linejoin="round"/><polyline points="190.00,135.00 268.00,135.00" fill="none" stroke="#6B7789" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#c2-arrow)"/><text x="50.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="175.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="95.00" y="44.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="280.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A′</text><text x="405.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B′</text><text x="325.00" y="44.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C′</text></svg>