<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 285" role="img" aria-labelledby="c4-title c4-desc"><title id="c4-title">Area of a rectangle</title><desc id="c4-desc">A rectangle with base b and perpendicular height h has area b times h.</desc><defs><marker id="c4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="285" fill="white"/><polygon points="85.00,50.00 405.00,50.00 405.00,205.00 85.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="85.00,191.00 99.00,191.00 99.00,205.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="245.00" y="235.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text><text x="57.00" y="130.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">h</text><text x="245.00" y="126.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">area = bh</text></svg>