<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t1-hl-title t1-hl-desc"><title id="t1-hl-title">Hypotenuse-leg congruence</title><desc id="t1-hl-desc">Both triangles have right angles at A and D. Their hypotenuses BC and EF and legs AB and DE are marked equal. The correspondence is A to D, B to E, and C to F.</desc><defs><marker id="t1-hl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polygon points="55.00,205.00 185.00,205.00 55.00,65.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="285.00,205.00 415.00,205.00 285.00,65.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="70.00,205.00 70.00,190.00 55.00,190.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="116.18,142.64 127.90,131.75" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="112.10,138.25 123.82,127.36" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="120.00,197.00 120.00,213.00" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="300.00,205.00 300.00,190.00 285.00,190.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="346.18,142.64 357.90,131.75" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="342.10,138.25 353.82,127.36" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="350.00,197.00 350.00,213.00" fill="none" stroke="#087F8C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="55.00" y="231.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="185.00" y="231.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="55.00" y="40.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="285.00" y="231.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">D</text><text x="415.00" y="231.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">E</text><text x="285.00" y="40.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">F</text><text x="240.00" y="275.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="24" font-style="italic" text-anchor="middle" dominant-baseline="middle">△ABC ≅ △DEF</text></svg>