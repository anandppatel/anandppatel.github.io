<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="o2-tangent-counts-title o2-tangent-counts-desc"><title id="o2-tangent-counts-title">Tangents from boundary and interior points</title><desc id="o2-tangent-counts-desc">Left: P lies on a circle, and the vertical line touches the circle only at P; exactly one tangent passes through P. Right: P lies strictly inside a circle. Two example lines through P each cross the circle at two marked points, so both are secants. No tangent passes through an interior point.</desc><rect width="480" height="300" fill="white"/><circle cx="110.000" cy="150.000" r="70" fill="none" stroke="#20324A" stroke-width="3"/><circle cx="350.000" cy="150.000" r="70" fill="none" stroke="#20324A" stroke-width="3"/><line x1="180" y1="48" x2="180" y2="248" stroke="#087F8C" stroke-width="3" stroke-linecap="round"/><circle cx="180.000" cy="150.000" r="3.5" fill="#20324A" stroke="#20324A" stroke-width="0"/><text x="201" y="150" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">P</text><line x1="255" y1="150" x2="445" y2="150" stroke="#C46620" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="201" x2="445" y2="87" stroke="#6B7789" stroke-width="2.5" stroke-linecap="round"/><circle cx="280.000" cy="150.000" r="3.7" fill="#C46620" stroke="#C46620" stroke-width="0"/><circle cx="420.000" cy="150.000" r="3.7" fill="#C46620" stroke="#C46620" stroke-width="0"/><circle cx="287.491" cy="181.506" r="3.7" fill="#6B7789" stroke="#6B7789" stroke-width="0"/><circle cx="407.215" cy="109.671" r="3.7" fill="#6B7789" stroke="#6B7789" stroke-width="0"/><circle cx="340.000" cy="150.000" r="4" fill="#20324A" stroke="#20324A" stroke-width="0"/><text x="340" y="178" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">P</text><text x="110" y="24" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">on the circle</text><text x="350" y="24" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">inside the circle</text><text x="110" y="276" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">one tangent</text><text x="350" y="276" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">no tangents</text></svg>