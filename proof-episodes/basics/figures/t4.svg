<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t4-title t4-desc"><title id="t4-title">Strict triangle inequality</title><desc id="t4-desc">The direct side AB is shorter than the two sides AC and CB together in a nondegenerate triangle.</desc><defs><marker id="t4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polyline points="55.00,210.00 420.00,210.00" fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="55.00,210.00 210.00,55.00 420.00,210.00" fill="none" stroke="#087F8C" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><text x="40.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="438.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="210.00" y="30.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="240.00" y="275.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">AB &lt; AC + CB</text></svg>