<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="t6-title t6-desc"><title id="t6-title">Pythagoras and its converse</title><desc id="t6-desc">A right triangle has legs a and b and hypotenuse c. The equation a squared plus b squared equals c squared characterizes a right angle opposite c.</desc><defs><marker id="t6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polygon points="100.00,210.00 405.00,210.00 100.00,45.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="122.00,210.00 122.00,188.00 100.00,188.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="255.00" y="239.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">a</text><text x="70.00" y="127.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text><text x="268.00" y="102.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">c</text><text x="240.00" y="279.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="26" font-style="italic" text-anchor="middle" dominant-baseline="middle">a² + b² = c²</text></svg>