<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Same-side interior angles</title>
<desc id="desc">Two parallel horizontal lines are crossed by a sloping transversal. The two interior angles on the right of the transversal are marked alpha and beta, with alpha plus beta equal to 180 degrees.</desc>
<rect width="480" height="300" fill="white"/>
<g fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic">
<line x1="34.000" y1="82.000" x2="446.000" y2="82.000" stroke="#20324A"/><line x1="34.000" y1="210.000" x2="446.000" y2="210.000" stroke="#20324A"/><line x1="318.750" y1="28.000" x2="157.500" y2="286.000" stroke="#20324A"/><polyline points="102.000,76.000 110.000,82.000 102.000,88.000" stroke="#20324A"/><polyline points="112.000,76.000 120.000,82.000 112.000,88.000" stroke="#20324A"/><polyline points="102.000,204.000 110.000,210.000 102.000,216.000" stroke="#20324A"/><polyline points="112.000,204.000 120.000,210.000 112.000,216.000" stroke="#20324A"/><text x="434.000" y="67.000" fill="#20324A" stroke="none" text-anchor="middle">ℓ</text><text x="434.000" y="196.000" fill="#20324A" stroke="none" text-anchor="middle">m</text><path d="M 314.000,82.000 A 29,29 0 0 1 269.630,106.592" stroke="#C46620"/><path d="M 220.370,185.408 A 29,29 0 0 1 234.000,210.000" stroke="#087F8C"/><text x="313.000" y="131.000" fill="#C46620" stroke="none" text-anchor="middle">β</text><text x="251.000" y="188.000" fill="#087F8C" stroke="none" text-anchor="middle">α</text><text x="376.000" y="268.000" fill="#20324A" stroke="none" text-anchor="middle">α + β = 180°</text>
</g></svg>