<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
<title id="title">Equal tangent segments from an exterior point</title>
<desc id="desc">The two segments PA and PB touch a circle at A and B. Matching marks show that PA and PB have equal lengths. Dashed radii OA and OB each meet the corresponding tangent at a marked right angle.</desc>
<rect width="480" height="300" fill="white"/>
<g fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic">
<circle cx="168" cy="150" r="92"/><line x1="168.000" y1="150.000" x2="201.721" y2="64.403" stroke="#20324A" stroke-dasharray="5 6"/><line x1="201.721" y1="64.403" x2="419.000" y2="150.000" stroke="#087F8C"/><polyline points="197.323,75.568 208.488,79.966 212.886,68.801" stroke="#C46620"/><line x1="308.161" y1="112.784" x2="312.560" y2="101.619" stroke="#C46620"/><circle cx="201.721" cy="64.403" r="3.5" fill="#20324A" stroke="none"/><line x1="168.000" y1="150.000" x2="201.721" y2="235.597" stroke="#20324A" stroke-dasharray="5 6"/><line x1="201.721" y1="235.597" x2="419.000" y2="150.000" stroke="#087F8C"/><polyline points="197.323,224.432 208.488,220.034 212.886,231.199" stroke="#C46620"/><line x1="312.560" y1="198.381" x2="308.161" y2="187.216" stroke="#C46620"/><circle cx="201.721" cy="235.597" r="3.5" fill="#20324A" stroke="none"/><circle cx="168.000" cy="150.000" r="3.5" fill="#20324A" stroke="none"/><circle cx="419.000" cy="150.000" r="3.5" fill="#20324A" stroke="none"/><text x="149.000" y="157.000" fill="#20324A" stroke="none" text-anchor="middle">O</text><text x="198.721" y="46.403" fill="#20324A" stroke="none" text-anchor="middle">A</text><text x="198.721" y="264.597" fill="#20324A" stroke="none" text-anchor="middle">B</text><text x="440.000" y="157.000" fill="#20324A" stroke="none" text-anchor="middle">P</text>
</g></svg>