<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 325" role="img" aria-labelledby="c3-title c3-desc"><title id="c3-title">Dilation about a center</title><desc id="c3-desc">A dilation about O with scale factor two takes ABC to A prime B prime C prime. Corresponding points lie on the same rays from O. In general lengths multiply by k and areas by k squared.</desc><defs><marker id="c3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="325" fill="white"/><polyline points="35.00,240.00 165.00,170.00" fill="none" stroke="#6B7789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="35.00,240.00 305.00,170.00" fill="none" stroke="#6B7789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="35.00,240.00 215.00,70.00" fill="none" stroke="#6B7789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="100.00,205.00 170.00,205.00 125.00,155.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="165.00,170.00 305.00,170.00 215.00,70.00" fill="none" fill-opacity="1" stroke="#087F8C" stroke-width="3" stroke-linejoin="round"/><circle cx="35" cy="240" r="3.2" fill="#20324A"/><text x="21.00" y="262.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">O</text><text x="90.00" y="225.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="174.00" y="228.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="105.00" y="145.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="159.00" y="151.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A′</text><text x="326.00" y="176.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B′</text><text x="217.00" y="46.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C′</text><text x="385.00" y="58.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">k = 2</text><text x="240.00" y="294.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">Lengths: ×k; areas: ×k²</text></svg>