<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="c4-triangle-title c4-triangle-desc"><title id="c4-triangle-title">Area with an exterior altitude</title><desc id="c4-triangle-desc">The chosen base BC has length b. The perpendicular height h is AH, whose foot H lies outside BC. The area is one half b times h.</desc><defs><marker id="c4-triangle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="310" fill="white"/><polygon points="115.00,55.00 185.00,205.00 410.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="85.00,205.00 185.00,205.00" fill="none" stroke="#6B7789" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="115.00,55.00 115.00,205.00" fill="none" stroke="#087F8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="129.00,205.00 129.00,191.00 115.00,191.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="115.00" y="30.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="185.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="410.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="112.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">H</text><text x="88.00" y="124.00" fill="#087F8C" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">h</text><text x="297.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text><text x="255.00" y="277.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">area = ½bh</text></svg>