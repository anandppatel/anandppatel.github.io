<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img" aria-labelledby="t4-equality-title t4-equality-desc"><title id="t4-equality-title">Equality for collinear points</title><desc id="t4-equality-desc">Point C lies on segment AB between A and B. Therefore the length AB equals AC plus CB.</desc><defs><marker id="t4-equality-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="260" fill="white"/><polyline points="55.00,130.00 240.00,130.00" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="240.00,130.00 425.00,130.00" fill="none" stroke="#C46620" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="130" r="3.2" fill="#20324A"/><circle cx="425" cy="130" r="3.2" fill="#20324A"/><circle cx="240" cy="130" r="3.2" fill="#20324A"/><text x="55.00" y="100.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A</text><text x="240.00" y="100.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">C</text><text x="425.00" y="100.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">B</text><text x="240.00" y="216.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">AB = AC + CB</text></svg>