<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="c5-title c5-desc"><title id="c5-title">A right angle</title><desc id="c5-desc">Two perpendicular rays form a right angle of ninety degrees.</desc><defs><marker id="c5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polyline points="160.00,210.00 160.00,50.00" fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="160.00,210.00 375.00,210.00" fill="none" stroke="#20324A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polyline points="160.00,187.00 183.00,187.00 183.00,210.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="220.00" y="154.00" fill="#C46620" stroke="none" font-family="Garamond, Georgia, serif" font-size="27" font-style="italic" text-anchor="middle" dominant-baseline="middle">90°</text></svg>