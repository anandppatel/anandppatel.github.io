<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-labelledby="c4-equal-area-title c4-equal-area-desc"><title id="c4-equal-area-title">Equal bases and equal heights</title><desc id="c4-equal-area-desc">Two triangles lie between the same parallel horizontal lines. Their base lengths are both b and their heights are both h, so their areas are equal.</desc><defs><marker id="c4-equal-area-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="300" fill="white"/><polyline points="25.00,65.00 455.00,65.00" fill="none" stroke="#6B7789" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="25.00,205.00 455.00,205.00" fill="none" stroke="#6B7789" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="75.00,65.00 45.00,205.00 175.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="370.00,65.00 275.00,205.00 405.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="75.00,65.00 75.00,205.00" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="370.00,65.00 370.00,205.00" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="75.00,194.00 86.00,194.00 86.00,205.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="370.00,194.00 381.00,194.00 381.00,205.00" fill="none" stroke="#20324A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="100.00" y="138.00" fill="#087F8C" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">h</text><text x="345.00" y="138.00" fill="#087F8C" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">h</text><text x="110.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text><text x="340.00" y="233.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b</text><text x="240.00" y="274.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="normal" text-anchor="middle" dominant-baseline="middle">equal areas</text></svg>