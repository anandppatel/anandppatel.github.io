<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="c4-additivity-title c4-additivity-desc"><title id="c4-additivity-title">Adding the areas of polygonal pieces</title><desc id="c4-additivity-desc">Two diagonals divide a convex pentagon into three triangles with disjoint interiors. The area of the pentagon is the sum of the three areas.</desc><defs><marker id="c4-additivity-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="310" fill="white"/><polygon points="70.00,225.00 385.00,225.00 435.00,105.00" fill="#087F8C" fill-opacity="0.11" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="70.00,225.00 435.00,105.00 255.00,35.00" fill="#C46620" fill-opacity="0.12" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="70.00,225.00 255.00,35.00 45.00,110.00" fill="#20324A" fill-opacity="0.07" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><text x="300.00" y="187.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₁</text><text x="262.00" y="115.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₂</text><text x="123.00" y="122.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₃</text><text x="240.00" y="276.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">A = A₁ + A₂ + A₃</text></svg>