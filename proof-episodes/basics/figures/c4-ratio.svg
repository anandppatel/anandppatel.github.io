<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="c4-ratio-title c4-ratio-desc"><title id="c4-ratio-title">Common height and area ratio</title><desc id="c4-ratio-desc">Two triangles have a common perpendicular height h. Their area ratio equals the ratio of their base lengths b one and b two.</desc><defs><marker id="c4-ratio-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7789"/></marker></defs><rect width="480" height="310" fill="white"/><polyline points="30.00,65.00 455.00,65.00" fill="none" stroke="#6B7789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polyline points="30.00,205.00 455.00,205.00" fill="none" stroke="#6B7789" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><polygon points="85.00,65.00 45.00,205.00 155.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polygon points="310.00,65.00 230.00,205.00 445.00,205.00" fill="none" fill-opacity="1" stroke="#20324A" stroke-width="3" stroke-linejoin="round"/><polyline points="25.00,65.00 25.00,205.00" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="19.00,65.00 31.00,65.00" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="19.00,205.00 31.00,205.00" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="11.00" y="135.00" fill="#087F8C" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">h</text><text x="100.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b₁</text><text x="337.00" y="232.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">b₂</text><text x="96.00" y="159.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₁</text><text x="324.00" y="157.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₂</text><text x="240.00" y="276.00" fill="#20324A" stroke="none" font-family="Garamond, Georgia, serif" font-size="25" font-style="italic" text-anchor="middle" dominant-baseline="middle">A₁/A₂ = b₁/b₂</text></svg>